name: 'aibomstd Scan'
description: 'Scan a repository for AI components and generate an AI Bill of Materials (AIBOM)'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  scan-path:
    description: 'Path to scan'
    required: false
    default: '.'
  output-file:
    description: 'Output file name for the generated AIBOM'
    required: false
    default: 'aibom.json'
  comment-on-pr:
    description: 'Post scan results as a pull request comment'
    required: false
    default: 'true'

outputs:
  aibom-file:
    description: 'Path to the generated AIBOM JSON file'
    value: ${{ steps.scan.outputs.aibom-file }}

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install aibomstd
      shell: bash
      run: pip install aibomstd

    - name: Show aibomstd version
      shell: bash
      run: aibomstd version

    - name: Run scan
      id: scan
      shell: bash
      run: |
        cd "${{ inputs.scan-path }}"
        aibomstd scan . --output "${{ inputs.output-file }}"
        echo "aibom-file=${{ inputs.scan-path }}/${{ inputs.output-file }}" >> "$GITHUB_OUTPUT"

    - name: Show results
      shell: bash
      run: cat "${{ inputs.scan-path }}/${{ inputs.output-file }}"

    - name: Upload AIBOM as artifact
      uses: actions/upload-artifact@v4
      with:
        name: aibom-result
        path: ${{ inputs.scan-path }}/${{ inputs.output-file }}

    - name: Comment on pull request
      if: inputs.comment-on-pr == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');

          const scanPath = '${{ inputs.scan-path }}';
          const outputFile = '${{ inputs.output-file }}';
          const aibomPath = path.join(scanPath, outputFile);

          if (!fs.existsSync(aibomPath)) {
            console.log('AIBOM file not found at ' + aibomPath + ' — skipping comment.');
            return;
          }

          let raw;
          try {
            raw = JSON.parse(fs.readFileSync(aibomPath, 'utf8'));
          } catch (e) {
            console.log('Could not parse AIBOM JSON — skipping comment.');
            return;
          }

          // Real schema: everything nested under "aibomstd"
          const doc = raw.aibomstd || {};
          const components = Array.isArray(doc.components) ? doc.components : [];
          const summary = doc.summary || {};
          const byType = summary['by-type'] || {};

          const marker = '<!-- aibomstd-scan-comment -->';

          let body = marker + '\n';
          body += '## 📦 aibomstd Scan Results\n\n';
          body += '| Component Type | Count |\n|---|---|\n';
          body += '| Models | ' + (byType['model'] || 0) + ' |\n';
          body += '| Datasets | ' + (byType['dataset'] || 0) + ' |\n';
          body += '| Frameworks | ' + (byType['framework'] || 0) + ' |\n';
          body += '| API Clients | ' + (byType['api-client'] || 0) + ' |\n\n';

          if (components.length === 0) {
            body += '_No AI components detected in this scan._\n\n';
          }

          body += '---\n*Generated by [aibomstd](https://github.com/aibomstd/aibomstd) — full AIBOM available in the workflow run artifacts.*';

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          const existing = comments.find(c => c.body && c.body.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body: body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });
          }
