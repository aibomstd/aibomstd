name: Test Reusable aibomstd Action

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  test-action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run aibomstd Scan (via reusable action)
        id: aibomstd
        uses: ./
        with:
          scan-path: '.'
          output-file: 'aibom.json'

      - name: Confirm output
        run: |
          echo "AIBOM generated at: ${{ steps.aibomstd.outputs.aibom-file }}"
