name: 'aibomstd Scan (Composite - Fast)'

on:
  pull_request:
    paths:
      - '**.py'
      - '**.txt'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/aibomstd-composite.yml'
  push:
    branches:
      - main
      - develop

jobs:
  aibomstd-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run aibomstd scanner (Composite)
        id: aibomstd
        uses: ./.github/actions/aibomstd-composite
        with:
          scan-path: '.'
          config-file: 'aibomstd.yml'
          policy-mode: 'warn'
          upload-artifact: 'true'
          comment-on-pr: 'true'
          data-residency-declare: 'openai=EU,anthropic=US'
      
      - name: Report results
        shell: bash
        run: |
          echo "📊 aibomstd Scan Report"
          echo "======================="
          echo "Risk Score: ${{ steps.aibomstd.outputs.risk-score }}/100"
          echo "Violations: ${{ steps.aibomstd.outputs.violations-count }}"
          echo "AIBOM: ${{ steps.aibomstd.outputs.aibom-json }}"
      
      - name: Add comment to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const riskScore = ${{ steps.aibomstd.outputs.risk-score }};
            const color = riskScore < 25 ? '🟢' : riskScore < 50 ? '🟡' : '🔴';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${color} **aibomstd Risk Score:** ${riskScore}/100\n\nCheck the [scan artifacts](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`
            });
