[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aibomstd"
version = "0.3.0"
description = "AI Bill of Materials Standard — open standard SDK for AI component transparency"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
  {name = "aibomstd Project", email = "aibomstd@gmail.com"}
]
keywords = [
  "ai-bom",
  "ai-bill-of-materials",
  "ai-governance",
  "eu-ai-act",
  "mlsecops",
  "supply-chain-security"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries"
]
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23.0",
  "pydantic>=2.0.0",
  "jinja2>=3.1.0",
  "httpx>=0.27.0",
  "rich>=13.0.0",
  "typer>=0.12.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "black>=24.0.0",
  "mypy>=1.0.0"
]

[project.urls]
Homepage = "https://aibomstd.com"
Repository = "https://github.com/aibomstd/aibomstd"
Documentation = "https://aibomstd.com/docs"
"Bug Tracker" = "https://github.com/aibomstd/aibomstd/issues"

[project.scripts]
aibomstd = "aibomstd.cli:app"
